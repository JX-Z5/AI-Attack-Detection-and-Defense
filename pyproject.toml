[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-attack-detection-defense"
version = "1.0.0"
description = "Reproducible isolated experiment for distinguishing scripted, local-LLM-agent, and human-like web attack behavior"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "langchain-ollama>=0.2,<2",
  "langgraph>=0.2,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
ai-lab = "ai_lab.cli:main"

[tool.setuptools.packages.find]
include = ["ai_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

